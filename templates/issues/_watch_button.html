<div id="watch-btn">
  <form method="post"
        action="{% url 'issues:watch_toggle' issue.pk %}"
        hx-post="{% url 'issues:watch_toggle' issue.pk %}"
        hx-target="#watch-btn"
        hx-swap="outerHTML">
    {% csrf_token %}
    {% if is_watching %}
      <button type="submit"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm border border-blue-300 bg-blue-50 text-blue-700 rounded-md hover:bg-blue-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
          <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
        </svg>
        Surveillé
      </button>
    {% else %}
      <button type="submit"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm border border-gray-300 bg-white text-gray-600 rounded-md hover:bg-gray-50 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
        Surveiller
      </button>
    {% endif %}
  </form>
</div>
