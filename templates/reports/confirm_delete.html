{% extends "base.html" %}
{% block title %}Supprimer « {{ object.name }} »{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-3 text-red-400" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        <h1 class="text-lg font-bold text-gray-900 mb-1">Supprimer ce rapport ?</h1>
        <p class="text-sm text-gray-500 mb-6">
            Le rapport <strong>« {{ object.name }} »</strong> sera définitivement supprimé.
        </p>
        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Supprimer</button>
            <a href="{{ object.get_absolute_url }}" class="btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
