<!-- Sidebar wiki : TOC + navigation pages -->
<div class="space-y-4">

    <!-- Table des matières -->
    {% if toc_html %}
    <div class="bg-white rounded-xl shadow p-4">
        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Table des matières</h3>
        <div class="wiki-toc text-sm text-gray-700">{{ toc_html }}</div>
    </div>
    {% endif %}

    <!-- Navigation wiki -->
    <div class="bg-white rounded-xl shadow p-4">
        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Pages</h3>
        <ul class="space-y-1 text-sm">
            {% for p in all_pages %}
            <li>
                <a href="{{ p.get_absolute_url }}"
                   class="block px-2 py-1 rounded hover:bg-gray-100
                   {% if wiki_page and p.pk == wiki_page.pk %}bg-blue-50 text-blue-700 font-medium{% else %}text-gray-700{% endif %}">
                    {{ p.title }}
                </a>
            </li>
            {% empty %}
            <li class="text-gray-400 text-xs px-2">Aucune page.</li>
            {% endfor %}
        </ul>
        <div class="mt-3 pt-3 border-t space-y-1">
            {% if "edit_wiki" in user_perms %}
            <a href="{% url 'projects:wiki_edit' project.identifier 'nouvelle-page' %}"
               class="block text-xs text-blue-600 hover:underline px-2">+ Nouvelle page</a>
            {% endif %}
            <a href="{% url 'projects:wiki_list' project.identifier %}"
               class="block text-xs text-gray-500 hover:underline px-2">Index complet</a>
        </div>
    </div>

</div>
