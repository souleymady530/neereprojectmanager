{% extends "base.html" %}
{% block title %}Supprimer la saisie{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-white rounded-xl shadow p-6">
        <h1 class="text-xl font-bold mb-4 text-red-600">Supprimer la saisie</h1>
        <p class="text-gray-700 mb-4">
            Supprimer <strong>{{ object.hours }}h</strong>
            ({{ object.activity }}) du {{ object.spent_on|date:"d/m/Y" }} ?
        </p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit"
                class="bg-red-600 text-white px-5 py-2 rounded text-sm hover:bg-red-700">
                Supprimer
            </button>
            <a href="{% url 'projects:time_entries' object.project.identifier %}"
               class="px-5 py-2 rounded border text-sm hover:bg-gray-50">
                Annuler
            </a>
        </form>
    </div>
</div>
{% endblock %}
