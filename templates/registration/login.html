{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold mb-6">Connexion</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-600 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit"
            class="w-full bg-slate-700 text-white py-2 rounded hover:bg-slate-800">
            Se connecter
        </button>
    </form>
    <p class="mt-4 text-sm text-center">
        Pas encore de compte ?
        <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">S'inscrire</a>
    </p>
</div>
{% endblock %}
